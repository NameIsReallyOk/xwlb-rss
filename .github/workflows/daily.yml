name: 每日抓取新闻联播

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行爬虫
        run: |
          python fetch_xwlb.py
        env:
          TZ: Asia/Shanghai   # 强制使用北京时间，确保日期计算正确

      - name: 提交 RSS 文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xwlb.xml
          git diff --staged --quiet || git commit -m "自动更新: 新闻联播 RSS"
          git push

      - name: 准备 Pages 部署目录
        run: |
          mkdir -p public
          cp xwlb.xml public/

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
